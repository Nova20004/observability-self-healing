[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "BLE", "SIM", "RUF"]
ignore = ["S104"]  # binding 0.0.0.0 is required inside containers

[tool.ruff.lint.isort]
known-first-party = ["main", "circuit_breaker", "forensics"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
