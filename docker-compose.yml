name: obs-selfheal

# Mac-safe by design: no `pid: host`, no `network_mode: host`, no host root bind-mounts.
# Every service has a hard memory cap; Go services also get GOMEMLIMIT so their GC stays under it.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ---------------------------------------------------------------- workload
  app:
    build: ./app
    image: obs-selfheal/app:local
    <<: *hardening
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      LOG_LEVEL: INFO
      STRESS_MAX_SECONDS: "300"
    # Only the public API is published; the control API (8001) stays on the Docker network.
    ports:
      - "127.0.0.1:8000:8000"
    labels:
      logging: promtail
    logging: *logging
    mem_limit: 96m
    cpus: 1.0
    networks: [observability]

  # ~1 req/s background traffic (1 in 30 hits /fail) so dashboards show live data.
  loadgen:
    image: obs-selfheal/app:local
    pull_policy: never
    <<: *hardening
    restart: unless-stopped
    read_only: true
    command:
      - python
      - -c
      - |
        import time, urllib.request
        n = 0
        while True:
            n += 1
            path = "/fail" if n % 30 == 0 else "/"
            try:
                urllib.request.urlopen("http://app:8000" + path, timeout=2).read()
            except Exception:
                pass
            time.sleep(1)
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
    mem_limit: 24m
    cpus: 0.1
    networks: [observability]

  # ------------------------------------------------------------- remediation
  webhook:
    build: ./webhook
    image: obs-selfheal/webhook:local
    <<: *hardening
    restart: unless-stopped
    # No read_only here: Compose cannot inject environment-sourced secrets into a read-only rootfs.
    # The process still runs as uid 10001, which owns nothing outside the audit volume.
    environment:
      LOG_LEVEL: INFO
      WEBHOOK_TOKEN_FILE: /run/secrets/webhook_token
      REMEDIATION_COOLDOWN_SECONDS: ${REMEDIATION_COOLDOWN_SECONDS:-30}
      MAX_REMEDIATIONS_PER_WINDOW: ${MAX_REMEDIATIONS_PER_WINDOW:-2}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-600}
      REMEDIATION_DRY_RUN: ${REMEDIATION_DRY_RUN:-false}
      # Allowlist: <prometheus `service` label>=<container name>. Anything else is never restarted.
      REMEDIATION_TARGETS: app=obs-selfheal-app-1
      REMEDIATION_HEALTH_URLS: app=http://app:8000/health
      REMEDIATION_CONTROL_URLS: app=http://app:8001
      DOCKER_API_URL: http://docker-proxy-restart:2375
      DOCKER_RO_API_URL: http://docker-proxy-ro:2375
      AUDIT_LOG_PATH: /var/log/remediation/audit.jsonl
    secrets:
      - webhook_token
    volumes:
      - remediation-audit:/var/log/remediation
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      logging: promtail
    logging: *logging
    depends_on:
      docker-proxy-restart:
        condition: service_started
      docker-proxy-ro:
        condition: service_started
    mem_limit: 64m
    cpus: 0.5
    networks: [observability, docker-api-restart, docker-api-ro]

  # Restart-only: POST is allowed solely on /containers/<name>/(restart|stop|kill).
  # CONTAINERS stays 0 on purpose: with POST=1 it would also open /containers/create and /exec.
  docker-proxy-restart:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POST: "1"
      ALLOW_RESTARTS: "1"
      CONTAINERS: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      EVENTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    mem_limit: 32m
    cpus: 0.2
    networks: [docker-api-restart]

  # GET-only: container/network metadata and container logs (pre-mortem forensics, promtail discovery).
  docker-proxy-ro:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    mem_limit: 48m
    cpus: 0.2
    networks: [docker-api-ro]

  # ------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    environment:
      GOMEMLIMIT: 120MiB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    labels:
      logging: promtail
    logging: *logging
    mem_limit: 160m
    cpus: 0.5
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      GOMEMLIMIT: 32MiB
    secrets:
      - webhook_token
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    labels:
      logging: promtail
    logging: *logging
    mem_limit: 48m
    cpus: 0.2
    networks: [observability]

  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    environment:
      GOMEMLIMIT: 72MiB
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    logging: *logging
    mem_limit: 96m
    cpus: 0.5
    networks: [observability]

  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    environment:
      GOMEMLIMIT: 36MiB
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail-data:/var/lib/promtail
    depends_on:
      - loki
      - docker-proxy-ro
    logging: *logging
    mem_limit: 48m
    cpus: 0.2
    networks: [observability, docker-api-ro]

  # No host mounts, no host PID/network: works unchanged on Docker Desktop (macOS) and Linux.
  node-exporter:
    image: prom/node-exporter:v1.13.1
    <<: *hardening
    restart: unless-stopped
    read_only: true
    environment:
      GOMEMLIMIT: 16MiB
    logging: *logging
    mem_limit: 24m
    cpus: 0.1
    networks: [observability]

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 150MiB
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/service-overview.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    logging: *logging
    mem_limit: 192m
    cpus: 0.5
    networks: [observability]

secrets:
  webhook_token:
    environment: WEBHOOK_TOKEN
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

networks:
  observability: {}
  docker-api-restart:
    internal: true
  docker-api-ro:
    internal: true

volumes:
  prometheus-data: {}
  alertmanager-data: {}
  loki-data: {}
  promtail-data: {}
  grafana-data: {}
  remediation-audit: {}
